[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracelint"
version = "0.10.0"
description = "A linter for agent runs — reads the execution trace and flags structural bugs, deterministically."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashwin Ugale" }]
keywords = [
    "agents", "llm", "tool-calling", "traces", "static-analysis",
    "linter", "observability", "reliability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# Light core: jsonschema + stdlib only (tomli backports tomllib on 3.10). Heavy integrations live
# behind extras.
dependencies = [
    "jsonschema>=4.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# A real OpenAI ReAct agent used to *generate* traces to lint (the system under test,
# never part of the deterministic linter). Opt-in; the whole test/validation path is offline.
real-agent = ["openai>=1.0"]
# The Langfuse integration: `tracelint langfuse check` fetches traces and writes findings back
# as Scores. Targets the v3 Python SDK (get_client / create_score). The adapter itself is
# dependency-free — this extra is only needed for the live fetch/write-back path.
langfuse = ["langfuse>=3.0"]
# The DeepEval integration: `tracelint.integrations.deepeval.TracelintMetric` runs the rules as a
# DeepEval metric, so a team's existing DeepEval suite gets a deterministic structural check. The
# pure core (score_trace) is dependency-free — this extra is only the SDK the metric subclasses.
deepeval = ["deepeval>=1.0"]
# `tracelint.capture` — record an agent run to a lintable trace file. The base extra is just the
# OpenTelemetry SDK (the uniform capture mechanism); each per-framework extra adds that framework's
# stock OpenInference instrumentor, which capture wraps rather than reimplements.
capture = ["opentelemetry-sdk>=1.20"]
capture-smolagents = ["opentelemetry-sdk>=1.20", "openinference-instrumentation-smolagents>=0.1"]
capture-langchain = ["opentelemetry-sdk>=1.20", "openinference-instrumentation-langchain>=0.1"]
capture-crewai = ["opentelemetry-sdk>=1.20", "openinference-instrumentation-crewai>=0.1"]
# Everything needed to run the full test suite. opentelemetry-sdk is here so the capture mechanism
# test runs in CI (the per-framework instrumentors are not needed — that path is tested offline).
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "opentelemetry-sdk>=1.20",
]

[project.scripts]
tracelint = "tracelint.cli:main"

[project.urls]
Homepage = "https://tracelint.com"
Repository = "https://github.com/AshwinUgale/tracelint"
Issues = "https://github.com/AshwinUgale/tracelint/issues"
Changelog = "https://github.com/AshwinUgale/tracelint/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Run the suite from a source checkout without an editable install. "." puts the repo root on
# the path so tests can import the runnable `examples/` package.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks are illustrative documentation, not library code — don't hold cookbook cells to
# import-sorting / line-length rules meant for the package.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
