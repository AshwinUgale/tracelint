name: Deploy demo report to Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tracelint
        run: pip install -e .

      - name: Generate the demo report + redirect the root to tracelint.com
        run: |
          mkdir -p site/demo
          tracelint demo --html site/demo/index.html
          # The marketing site now lives at tracelint.com; keep the old Pages root as a
          # redirect so existing links land there instead of competing with it.
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>tracelint</title>
            <meta http-equiv="refresh" content="0; url=https://tracelint.com/">
            <link rel="canonical" href="https://tracelint.com/">
          </head>
          <body>Redirecting to <a href="https://tracelint.com/">tracelint.com</a>.</body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
