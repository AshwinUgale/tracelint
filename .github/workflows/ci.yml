name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests examples
      - name: Pytest
        run: python -m pytest -q
      - name: Demo self-check (validation suite + scorecard, keyless)
        run: tracelint demo

  action:
    # The GitHub Action as users run it (uses: AshwinUgale/tracelint@vX), from this checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: A clean trace passes
        uses: ./
        with:
          traces: examples/traces/smolagents_trace.json
          format: openinference
      - name: A named release installs from PyPI
        uses: ./
        with:
          traces: examples/traces/smolagents_trace.json
          format: openinference
          version: "0.9.0"
      - name: Write the release agent's contract
        run: |
          cat > "$RUNNER_TEMP/release_tools.json" <<'EOF'
          {"tools": {
            "run_release_pipeline": {"metadata": {"failure_when": {"pointer": "/result", "in": ["FAILURE", "UNSTABLE", "ABORTED"]}}},
            "deploy": {"metadata": {"side_effecting": true}}
          }}
          EOF
      - name: A hard defect fails the step
        id: defect
        continue-on-error: true
        uses: ./
        with:
          traces: examples/traces/langgraph_phoenix_trace.json
          format: openinference
          tools: ${{ runner.temp }}/release_tools.json
          sarif: tracelint.sarif
      - name: Check the defect failed the step and the SARIF was still written
        env:
          OUTCOME: ${{ steps.defect.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -s tracelint.sarif
      - name: Write a project config (format, tools, a lower gate)
        run: |
          cat > tracelint.toml <<EOF
          format = "openinference"
          tools = "$RUNNER_TEMP/release_tools.json"
          fail_on = "hard_event"
          EOF
      - name: The config drives the action
        id: configured
        continue-on-error: true
        uses: ./
        with:
          traces: examples/traces/langgraph_phoenix_trace.json
      - name: Check the configured run failed on the defect
        env:
          OUTCOME: ${{ steps.configured.outcome }}
        run: test "$OUTCOME" = failure
